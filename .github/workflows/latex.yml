name: LaTeX checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-xetex texlive-lang-chinese lmodern poppler-utils
      - name: Compile and verify
        run: python3 tests/run.py --engine xelatex --require-pdf-text
      - name: Build illustrated manual
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=build/xelatex docs/gradbars-manual.tex
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=build/xelatex docs/gradbars-manual.tex
      - name: Upload examples and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradbars-xelatex
          path: build/xelatex/
