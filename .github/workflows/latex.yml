name: LaTeX checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-xetex texlive-lang-chinese lmodern
      - name: Build illustrated manual
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -jobname=gradbars-manual-v0.0.1 docs/gradbars-manual.tex
          xelatex -interaction=nonstopmode -halt-on-error -jobname=gradbars-manual-v0.0.1 docs/gradbars-manual.tex
